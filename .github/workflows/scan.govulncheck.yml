name: Scan-Go-Vulnerabilities

# govulncheck is the only Go scanner that filters by reachability: it reports a
# vulnerability solely when the binary can actually reach the affected symbol. That makes
# its output triaged on arrival, unlike a Dependabot manifest diff.
#
# The scan runs on the newest supported Go release rather than the 1.16 floor in
# core/go.mod. Standard library findings depend on the toolchain doing the building, and a
# scan on an end-of-life toolchain reports every stdlib defect fixed since, which says
# nothing about this SDK's own code.
#
# Results upload to code scanning rather than failing the job. Dismissing an alert there
# records who accepted a risk and why, which is the audit trail a release review needs. To
# make this blocking, require the "Code scanning results" check in branch protection; that
# keeps the policy decision out of this file.

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'core/**'
      - 'test/**'
      - '.github/workflows/scan.govulncheck.yml'

  # New advisories are published against unchanged code, so the scheduled run is where
  # most findings will come from.
  schedule:
    - cron: '17 6 * * 1'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false  # core has no external dependencies and no go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      # The vulnerability database is fetched at run time from vuln.go.dev, so pinning the
      # tool above does not pin the advisory data.
      - name: Scan core
        working-directory: ./core
        run: govulncheck -format sarif ./... > "${GITHUB_WORKSPACE}/govulncheck-core.sarif"

      - name: Report reachable vulnerabilities
        run: |
          count=$(jq '[.runs[0].results[]? | select(.level == "error")] | length' \
            "${GITHUB_WORKSPACE}/govulncheck-core.sarif")
          echo "### govulncheck: core" >> "${GITHUB_STEP_SUMMARY}"
          if [ "${count}" -eq 0 ]; then
            echo "No reachable vulnerabilities." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "${count} reachable vulnerabilities. See the Security tab." >> "${GITHUB_STEP_SUMMARY}"
            jq -r '.runs[0].results[]? | select(.level == "error") | "- \(.ruleId)"' \
              "${GITHUB_WORKSPACE}/govulncheck-core.sarif" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@24c7eb380a2dc368f2d129e4c65e51d172983a1e # v4
        with:
          sarif_file: govulncheck-core.sarif
          category: govulncheck-core

name: Test-Go

on:
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  test-go:
    permissions:
      contents: read
    strategy:
      matrix:
        # 1.16 is the floor declared in core/go.mod. 1.25 and 1.26 are the versions
        # upstream Go still supports, so they are what consumers actually compile with.
        go-version: [1.16.x, 1.20.x, 1.22.x, 1.25.x, 1.26.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./test
    steps:

    - name: Install Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - run: |
        echo "replace github.com/keeper-security/secrets-manager-go/core => ../core" >> go.mod

    - run: pwd; ls -la; cat go.mod

    - name: Run integration tests
      run: go test -p 1 ./...

    - name: Run core unit tests
      working-directory: ./core
      run: go test ./...
